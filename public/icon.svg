<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="210" stroke="#334155" stroke-width="4" stroke-dasharray="12 12" fill="none" opacity="0.4" />

  <!-- Newspaper / Card Outline -->
  <rect x="110" y="110" width="292" height="292" rx="28" fill="#1e293b" stroke="#475569" stroke-width="4" />
  
  <!-- Header Bar of Paper -->
  <rect x="140" y="145" width="232" height="24" rx="8" fill="url(#accent)" />
  
  <!-- News layout lines -->
  <rect x="140" y="195" width="130" height="90" rx="10" fill="#334155" />
  <circle cx="175" cy="225" r="14" fill="url(#pulse)" />
  <path d="M155 270 Q175 250 195 270 T235 260" stroke="#64748b" stroke-width="4" fill="none" />
  
  <rect x="290" y="195" width="82" height="14" rx="6" fill="#94a3b8" />
  <rect x="290" y="220" width="70" height="10" rx="5" fill="#64748b" />
  <rect x="290" y="240" width="80" height="10" rx="5" fill="#64748b" />
  <rect x="290" y="260" width="60" height="10" rx="5" fill="#64748b" />
  <rect x="290" y="280" width="75" height="10" rx="5" fill="#64748b" />

  <!-- Pulse waveform across bottom -->
  <path d="M140 330 L190 330 L205 310 L220 355 L240 295 L255 345 L270 330 L372 330" stroke="url(#pulse)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <rect x="140" y="365" width="160" height="10" rx="5" fill="#475569" />
  <rect x="315" y="365" width="57" height="10" rx="5" fill="#f43f5e" />
</svg>
